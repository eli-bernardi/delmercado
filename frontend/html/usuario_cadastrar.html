<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Del Mercado - Cadastrar Usuário</title>
  <link rel="shortcut icon" href="/img/dell.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <!-- <link rel="stylesheet" href="../css/style_cad.css"> -->
  <script src="../js/usuario_cadastrar.js" defer></script>
</head>

<body>

  <header class="cabecalho">
    <a href="../index.html" class="logo">Del Mercado</a>
    <nav class="navegacao">
      <a href="../index.html">Início</a>
      <a href="usuario_cadastrar.html" class="ativo">Cadastrar</a>
      <a href="usuario_listar.html">Listar</a>
      <a href="usuario_consultar.html">Consultar</a>
      <a href="usuario_atualizar.html">Atualizar</a>
      <a href="usuario_apagar.html">Apagar</a>
    </nav>
  </header>

  <main class="conteudo-principal">

    <div class="cabecalho-pagina revelar ativo">
      <div>
        <h1 class="titulo-pagina">Cadastrar Novo Usuário</h1>
        <p class="subtitulo-pagina">Preencha os dados abaixo para adicionar um novo usuário ao sistema.</p>
        <hr class="divisoria">
      </div>
    </div>

    <div id="resposta" class="toast"></div>

    <section class="painel-vidro formulario-container revelar ativo">
      <form id="user-form" class="formulario">
        <div class="campo-formulario">
          <label class="rotulo-formulario">Nome *</label>
          <input type="text" id="nome" class="entrada-formulario" required>
        </div>

        <div class="campo-formulario">
          <label class="rotulo-formulario">Sobrenome *</label>
          <input type="text" id="sobrenome" class="entrada-formulario" required>
        </div>

        <div class="campo-formulario">
          <label class="rotulo-formulario">Idade *</label>
          <input type="number" id="idade" class="entrada-formulario" min="1" required>
        </div>

        <div class="campo-formulario">
          <label class="rotulo-formulario">E-mail *</label>
          <input type="email" id="email" class="entrada-formulario" required>
        </div>

        <div class="campo-formulario">
          <label class="rotulo-formulario">Telefone</label>
          <input type="text" id="telefone" class="entrada-formulario" placeholder="(XX) XXXXX-XXXX">
        </div>

        <div class="campo-formulario">
          <label class="rotulo-formulario">Endereço</label>
          <input type="text" id="endereco" class="entrada-formulario">
        </div>

        <div class="campo-formulario">
          <label class="rotulo-formulario">Cidade</label>
          <input type="text" id="cidade" class="entrada-formulario">
        </div>

        <div class="campo-formulario">
          <label class="rotulo-formulario">Estado</label>
          <input type="text" id="estado" class="entrada-formulario" placeholder="SC, SP...">
        </div>

        <div class="acoes-formulario">
          <button type="submit" class="botao-outline" id="btn_cadastrar">Cadastrar</button>
          <button type="button" class="botao-outline" id="btn_carga_lote"
            style="background: rgba(250,204,21,0.15); border-color: #facc15; color: #facc15;">Carga em Lote
            (DummyJSON)</button>
        </div>
      </form>
    </section>

  </main>

  <footer class="rodape">
    <div class="conteudo-rodape">
      <p>&copy; 2026 - Del Company | Todos os direitos reservados</p>
    </div>
  </footer>

</body>

</html>
